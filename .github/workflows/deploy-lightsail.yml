name: Deploy NourApp API to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS app
        run: npm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Create deploy directory
        run: |
          ssh -i ~/.ssh/lightsail_key \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            "mkdir -p ${{ secrets.DEPLOY_PATH }}"

      - name: Upload dist
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/lightsail_key" \
            dist/ \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ secrets.DEPLOY_PATH }}/dist/

      - name: Upload package files
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/lightsail_key" \
            package.json package-lock.json \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Install production dependencies and restart PM2
        run: |
          ssh -i ~/.ssh/lightsail_key \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
              set -e

              cd /home/ubuntu/apps/nourapp-api

              npm ci --omit=dev

              if pm2 describe nourapp-api > /dev/null; then
                pm2 reload nourapp-api --update-env
              else
                pm2 start dist/main.js --name nourapp-api --update-env
              fi

              pm2 save
          EOF