
      - name: Install dependencies, migrate database, and restart PM2
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            -i ~/.ssh/lightsail_key \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'

              set -Eeuo pipefail

              echo "========================================"
              echo "Loading Node environment"
              echo "========================================"

              export NVM_DIR="$HOME/.nvm"

              if [ -s "$NVM_DIR/nvm.sh" ]; then
                . "$NVM_DIR/nvm.sh"
                nvm use 18 || nvm use default
              fi

              export PATH="$HOME/.nvm/versions/node/v18.13.0/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

              command -v node
              command -v npm

              node -v
              npm -v

              if ! command -v pm2 >/dev/null 2>&1; then
                npm install -g pm2 --no-audit --no-fund
              fi

              echo ""
              echo "========================================"
              echo "Preparing deployment"
              echo "========================================"

              cd "$DEPLOY_PATH"

              test -f .env || {
                echo "ERROR: Production .env file not found."
                exit 1
              }

              test -f dist/infrastructure/database/typeorm.data-source.js || {
                echo "ERROR: Compiled TypeORM DataSource not found."
                exit 1
              }

              echo "Checking database synchronization setting..."

              if grep -Eq '^[[:space:]]*DB_SYNCHRONIZE[[:space:]]*=[[:space:]]*true([[:space:]]*(#.*)?)?$' .env; then
                echo "ERROR: DB_SYNCHRONIZE=true in production .env."
                echo "Set DB_SYNCHRONIZE=false before deployment."
                exit 1
              fi

              # Explicitly disable TypeORM schema synchronization
              # for the application started by PM2.
              export DB_SYNCHRONIZE=false

              echo ""
              echo "========================================"
              echo "Installing production dependencies"
              echo "========================================"

              npm ci --omit=dev --no-audit --no-fund

              echo ""
              echo "========================================"
              echo "Checking and running the newest migration"
              echo "========================================"

              node <<'NODE'
              const fs = require('node:fs');
              const path = require('node:path');
              const { DataSource } = require('typeorm');

              const migrationsDir = path.resolve(
                'dist/infrastructure/database/migrations'
              );

              const migrationFiles = fs.readdirSync(migrationsDir)
                .filter(file => /^\d+-.+\.js$/.test(file))
                .sort((a, b) => {
                  const ta = Number(a.match(/^(\d+)-/)[1]);
                  const tb = Number(b.match(/^(\d+)-/)[1]);
                  return ta - tb;
                });

              if (migrationFiles.length === 0) {
                throw new Error('No compiled migration files found.');
              }

              const dataSourceModule = require(
                './dist/infrastructure/database/typeorm.data-source.js'
              );

              const original = dataSourceModule.default;

              if (!original || !original.options) {
                throw new Error(
                  'Could not load the configured TypeORM DataSource.'
                );
              }

              const baseOptions = {
                ...original.options,
                synchronize: false,
                migrationsRun: false,
              };

              (async () => {
                // Read the latest recorded migration timestamp.
                // This intentionally ignores older migration files
                // that are missing from the existing migration history.
                const probe = new DataSource({
                  ...baseOptions,
                  migrations: [],
                });

                let lastAppliedTimestamp = 0;

                try {
                  await probe.initialize();

                  const rows = await probe.query(
                    'SELECT MAX("timestamp") AS "timestamp" FROM "migrations"'
                  );

                  lastAppliedTimestamp = Number(
                    rows[0]?.timestamp ?? 0
                  );
                } finally {
                  if (probe.isInitialized) {
                    await probe.destroy();
                  }
                }

                console.log(
                  'Latest recorded migration timestamp:',
                  lastAppliedTimestamp
                );

                // Only consider migrations newer than the latest
                // recorded migration. Never run the entire migration list.
                const newMigrations = migrationFiles.filter(file => {
                  const timestamp = Number(
                    file.match(/^(\d+)-/)[1]
                  );

                  return timestamp > lastAppliedTimestamp;
                });

                if (newMigrations.length === 0) {
                  console.log(
                    'No new migration. Skipping migration execution.'
                  );
                  return;
                }

                // Fail safely if multiple migrations were added.
                // This prevents silently skipping intermediate migrations.
                if (newMigrations.length > 1) {
                  throw new Error(
                    `Found ${newMigrations.length} new migrations: ` +
                    `${newMigrations.join(', ')}. ` +
                    'Deploy one new migration at a time.'
                  );
                }

                const migrationFile = newMigrations[0];

                const migrationModule = require(
                  path.join(migrationsDir, migrationFile)
                );

                const MigrationClass = Object.values(migrationModule).find(
                  value =>
                    typeof value === 'function' &&
                    typeof value.prototype?.up === 'function'
                );

                if (!MigrationClass) {
                  throw new Error(
                    `Could not find migration class in ${migrationFile}`
                  );
                }

                console.log(
                  'Executing only migration:',
                  MigrationClass.name
                );

                // Construct a DataSource containing exactly one migration.
                const runner = new DataSource({
                  ...baseOptions,
                  migrations: [MigrationClass],
                });

                try {
                  await runner.initialize();

                  const executed = await runner.runMigrations({
                    transaction: 'all',
                  });

                  console.log(
                    'Executed migrations:',
                    executed.map(migration => migration.name)
                  );

                  if (executed.length === 0) {
                    console.log(
                      'Migration already recorded. Nothing to execute.'
                    );
                  }
                } finally {
                  if (runner.isInitialized) {
                    await runner.destroy();
                  }
                }
              })().catch(error => {
                console.error('MIGRATION FAILED:', error);
                process.exitCode = 1;
              });
              NODE

              echo ""
              echo "========================================"
              echo "Restarting backend"
              echo "========================================"

              if pm2 describe nourapp-api >/dev/null 2>&1; then
                pm2 reload nourapp-api --update-env
              else
                pm2 start dist/main.js \
                  --name nourapp-api \
                  --update-env
              fi

              echo "Waiting for backend startup..."
              sleep 5

              echo ""
              echo "========================================"
              echo "Verifying PM2 status"
              echo "========================================"

              pm2 jlist | node -e '
                let input = "";

                process.stdin.on("data", chunk => input += chunk);

                process.stdin.on("end", () => {
                  try {
                    const apps = JSON.parse(input);
                    const app = apps.find(
                      item => item.name === "nourapp-api"
                    );

                    if (!app || app.pm2_env.status !== "online") {
                      console.error(
                        "ERROR: nourapp-api is not online."
                      );
                      process.exit(1);
                    }

                    console.log(
                      "nourapp-api is online. PID:",
                      app.pid
                    );
                  } catch (error) {
                    console.error(error);
                    process.exit(1);
                  }
                });
              '

              pm2 save

              echo ""
              echo "========================================"
              echo "Deployment completed successfully"
              echo "========================================"

          EOF
