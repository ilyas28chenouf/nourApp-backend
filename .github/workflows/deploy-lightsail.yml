name: Deploy NourApp API to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS app
        run: npm run build

      - name: Prepare SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -e

          if [ -z "$LIGHTSAIL_HOST" ]; then
            echo "ERROR: LIGHTSAIL_HOST secret is missing"
            exit 1
          fi

          if [ -z "$LIGHTSAIL_SSH_KEY" ]; then
            echo "ERROR: LIGHTSAIL_SSH_KEY secret is missing"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key

          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -i ~/.ssh/lightsail_key \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "echo SSH OK && hostname && whoami"

      - name: Create deploy directory
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/lightsail_key \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      - name: Upload dist
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/lightsail_key" \
            dist/ \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}:${DEPLOY_PATH}/dist/"

      - name: Upload package files
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/lightsail_key" \
            package.json package-lock.json \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}:${DEPLOY_PATH}/"

      - name: Install production dependencies and restart PM2
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/lightsail_key \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'
              set -e

              echo "Loading Node environment..."

              export NVM_DIR="$HOME/.nvm"

              if [ -s "$NVM_DIR/nvm.sh" ]; then
                . "$NVM_DIR/nvm.sh"
                nvm use 18 || nvm use default
              fi

              export PATH="$HOME/.nvm/versions/node/v18.13.0/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

              echo "Checking server tools..."

              command -v node || {
                echo "ERROR: node not found in non-interactive SSH session"
                echo "PATH=$PATH"
                exit 1
              }

              node -v

              command -v npm || {
                echo "ERROR: npm not found in non-interactive SSH session"
                echo "PATH=$PATH"
                exit 1
              }

              npm -v

              command -v pm2 || {
                echo "ERROR: pm2 not found. Installing pm2 locally for this Node version..."
                npm install -g pm2
              }

              pm2 -v

              echo "Go to deploy folder..."
              cd "$DEPLOY_PATH"

              echo "Files in deploy folder:"
              ls -la

              echo "Install production dependencies..."
              npm ci --omit=dev

              echo "Restart PM2 app..."
              if pm2 describe nourapp-api > /dev/null; then
                pm2 reload nourapp-api --update-env
              else
                pm2 start dist/main.js --name nourapp-api --update-env
              fi

              pm2 save
          EOF